server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3307/bazaarly?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jackson.serialization.write-dates-as-timestamps=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
app.jwt.secret=${JWT_SECRET:change-this-secret-key-to-something-long-and-random-32+chars}
app.jwt.expiry-hours=24
app.upload-dir=uploads
app.cors-origin=http://localhost:4200
app.seed-demo-data=true
